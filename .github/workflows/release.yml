#
# Releases the library: the tag v<VERSION> and a GitHub Release, on the commit
# merged into main. The tag's source archive
# (https://github.com/<repo>/archive/refs/tags/v<VERSION>.tar.gz) is what a package
# recipe, such as a ConanCenter one, builds from. CMake and Conan read VERSION from
# that source, so VERSION is raised by hand on develop, and version-check.yml holds
# a pull request into main to that.
name: release

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time: each reads the version the one before it took.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The test workflow has already succeeded for this commit on main. Release
    # only when that commit is a pull request merged into main; a direct push
    # stays unreleased. .github/scripts/release_decision.py decides: VERSION ahead
    # of the last tag is a release, nothing shipped changed is not, and shipped
    # files changed with VERSION unraised fails here rather than skip quietly.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Every tag: the last release's tag is what the decision compares with.
      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a release
        id: decide
        if: steps.gate.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 .github/scripts/release_decision.py decide cmake - "$SHA" src include CMakeLists.txt cmake conanfile.py

      # Publishing and this step are one release: the tag it creates is the
      # baseline the next decision compares with.
      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes
